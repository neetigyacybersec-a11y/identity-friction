# Local run. `docker compose up` then open http://localhost:8000
#
# The demo needs no credentials and no network, so this works on a laptop and in
# CI as-is. Live mode is a separate opt-in profile below, because a container
# that quietly points at a real tenant by default is a footgun.
services:
  app:
    build: .
    image: entra-identity-defense
    container_name: entra-identity-defense
    ports:
      - "8000:8000"
    environment:
      MODE: demo
      # Writable inside the container, so the database survives a restart.
      DATABASE_PATH: /app/data/entra_defense.db
      LOG_LEVEL: INFO
      # Deliberately empty. With no key, decisions come from the offline rule
      # engine and the project still works end to end.
      OPENROUTER_API_KEY: ""
    volumes:
      # The database is a volume, not a file baked into the image, so incidents
      # survive `docker compose down`.
      - app-data:/app/data

  # Live collection against a real tenant. This service is behind a profile, so
  # `docker compose up` on its own cannot reach a tenant and has to be asked to
  # explicitly.
  #
  #   cp .env.example .env    # fill in the three GRAPH_* values and an OpenRouter key
  #   docker compose --profile live up
  #
  # It gets its own volume, and its own port, because sharing app-data with the
  # demo service would mix synthetic events into a real tenant's database. The
  # two stores stay separate so neither can contaminate the other.
  live:
    build: .
    image: entra-identity-defense
    container_name: entra-identity-defense-live
    profiles:
      - live
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MODE: live
      DATABASE_PATH: /app/data/entra_defense.db
      LOG_LEVEL: INFO
    volumes:
      - app-live-data:/app/data

volumes:
  app-data:
  app-live-data:
