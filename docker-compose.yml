# Local run. `docker compose up` then open http://localhost:8000
#
# The demo needs no credentials and no network, so this works on a laptop and in
# CI as-is. Live mode is a separate opt-in profile below, because a container
# that quietly points at a real tenant by default is a footgun.
services:
  app:
    build: .
    image: entra-identity-defense
    container_name: entra-identity-defense
    ports:
      - "8000:8000"
    environment:
      MODE: demo
      # Writable inside the container, so the database survives a restart.
      DATABASE_PATH: /app/data/entra_defense.db
      LOG_LEVEL: INFO
      # Deliberately empty. With no key, decisions come from the offline rule
      # engine and the project still works end to end.
      OPENROUTER_API_KEY: ""
    volumes:
      # The database is a volume, not a file baked into the image, so incidents
      # survive `docker compose down`.
      - app-data:/app/data

volumes:
  app-data:

# Live collection against a real tenant:
#
#   cp .env.example .env    # then fill in the three graph values and an OpenRouter key
#   docker compose --profile live up
#
# Keeping this behind a profile means the default path cannot reach a tenant.
# See docs/adr/0002-signal-not-proof.md before pointing this at anything real.
