[build-system]
# Declared explicitly because the Dockerfile runs `pip install .`, and without
# a build backend setuptools guesses at the layout. It would guess wrong here:
# this repository has several top-level directories (`app`, `scripts`, `tests`,
# `docs`) and auto-discovery refuses to guess among them.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-friction"
version = "0.1.0"
description = "Signal triage for Microsoft Entra ID telemetry. Deterministic detections, model-assisted review, analyst decides."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
# `entra-analyze --demo` after an install, so the CLI is reachable without
# knowing the module path.
entra-analyze = "scripts.run_analysis:main"

[tool.setuptools.packages.find]
# Scoped discovery rather than a hand-written list. A literal list of just
# `["app", "scripts"]` installs the two top-level packages and none of their
# subpackages, so the installed copy raises ModuleNotFoundError on the first
# import that reaches into app.database. Every subpackage under these two
# prefixes ships; `tests` and `docs` deliberately do not.
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
# schema.sql and the Jinja templates are read at runtime by path, so they have
# to travel with the package or the repository works and the installed copy
# does not. Omitting this is a classic and very quiet packaging bug.
app = ["database/*.sql", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fail if a test needs the network. Several adapters accept an injected client
# precisely so this is possible, and a suite that quietly reaches OpenRouter is
# slow, non-deterministic and dependent on somebody's key.
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "scripts/*",
]
